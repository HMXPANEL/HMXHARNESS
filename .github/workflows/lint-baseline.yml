name: Refresh lint baseline (maintenance)

# Dispatch-only. Regenerates app/lint-baseline.xml after intentional source
# changes shift line numbers or rename resources, so CI keeps failing on NEW
# lint issues while inherited upstream findings stay baselined.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Regenerate baseline
        run: ./gradlew :app:updateLintBaseline --no-daemon --stacktrace
      - name: Upload refreshed baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-baseline
          path: app/lint-baseline.xml
          if-no-files-found: error
