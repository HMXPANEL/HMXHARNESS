name: HMXHARNESS Android Release Build

# Produces the installable release APK (applicationId com.hmx.harness) on a
# cloud runner. Release signing uses AGP's debug signing config inherited from
# upstream, so no private keystore or CI secret is needed. If a dedicated
# release keystore is configured later, replace signingConfigs with secrets.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: hmxharness-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure GitHub OAuth Client ID
        env:
          # Public OAuth App identifier. Accept either a repository variable or
          # an existing secret so older setups keep working; never printed.
          CLIENT_ID: ${{ vars.HMX_GITHUB_CLIENT_ID || secrets.HMX_GITHUB_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLIENT_ID:-}" ]; then
            printf 'GITHUB_CLIENT_ID=%s\n' "$CLIENT_ID" >> local.properties
            echo "GitHub Device Flow Client ID configured."
          else
            echo "::warning::HMX_GITHUB_CLIENT_ID is not set. GitHub sign-in stays disabled in this build; personal access tokens remain available."
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned NDK and shader compiler
        run: |
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          sudo apt-get update && sudo apt-get install -y glslc

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and stage release APK
        id: apk
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk" || { echo "Missing or empty release APK"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/HMXHARNESS-${GITHUB_REF_NAME}-release.apk"
          echo "size=$(stat -c%s "$apk")" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: hmxharness-release-apk
          path: dist/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Publish build summary
        if: always()
        run: |
          {
            echo "## HMXHARNESS Release"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Release APK: \`app/build/outputs/apk/release/app-release.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"
